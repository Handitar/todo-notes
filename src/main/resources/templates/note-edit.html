<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Edit note</title>
</head>
<body>

<h1>Edit note</h1>

<form th:action="@{/note/edit}" th:object="${note}" method="post">
    <input type="hidden" th:field="*{id}" />

    <div>
        <label>Title:</label><br/>
        <input type="text" th:field="*{title}" />
        <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:red;"></div>
    </div>

    <div style="margin-top:10px;">
        <label>Content:</label><br/>
        <textarea rows="6" cols="50" th:field="*{content}"></textarea>
        <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" style="color:red;"></div>
    </div>

    <div style="margin-top:10px;">
        <button type="submit">Save</button>
        <a th:href="@{/note/list}">Cancel</a>
    </div>
</form>

</body>
</html>
